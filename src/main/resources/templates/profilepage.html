<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Profile</title>
</head>

<body class="profile-page">
    <div class="top-bar">
        <h1><i class="bi bi-terminal" style="font-size: 2em;"></i></h1>
    </div>

    <div class="columns">
        <div class="left-column">
            <div class="nav-icons-top">
                <a href="/frontpage">
                    <button type="button" class="homeButton">
                        <i class="bi bi-house-door-fill" id="homeIcon"></i>
                    </button>
                </a>
                <a href="profilepage">
                    <button type="button" class="profileButton">
                        <i class="bi bi-person-fill" id="profileIcon"></i>
                    </button>
                </a>
            </div>

            <div class="nav-icons-bottom">
                <a href="settingspage">
                    <button type="button" class="settingsButton">
                        <i class="bi bi-gear-fill" id="settingsIcon"></i>
                    </button>
                </a>
                <a href="logout">
                    <button type="button" class="logoutButton">
                        <i class="bi bi-box-arrow-right" id="logoutIcon"></i>
                    </button>
                </a>
            </div>
        </div>

        <div class="center-column">
            <div class="content-box">
                <div class="content-heading">
                    <h1 th:text="${username}"></h1>
                </div>
                <div class="content-heading">
                    <h2>Sinun postaukset</h2>
                </div>
                <div th:each="userPost : ${userPosts}" class="post-box">
                    <strong th:text="${userPost.username}"></strong>
                    <p th:text="${userPost.message}"></p>
                    <i class="bi bi-hand-thumbs-up"></i>
                </div>
            </div>
        </div>
</body>
