<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>SETTINGS</title>
</head>

<body class="settings-page">
    <div class="top-bar">
        <h1><i class="bi bi-terminal" style="font-size: 2em;"></i></h1>
    </div>

    <div class="columns">
        <div class="left-column">
            <div class="nav-icons-top">
                <a href="/frontpage">
                    <button type="button" class="homeButton">
                        <i class="bi bi-house-door-fill" id="homeIcon"></i>
                    </button>
                </a>
                <a href="profilepage">
                    <button type="button" class="profileButton">
                        <i class="bi bi-person-fill" id="profileIcon"></i>
                    </button>
                </a>
            </div>

            <div class="nav-icons-bottom">
                <a href="settingspage">
                    <button type="button" class="settingsButton">
                        <i class="bi bi-gear-fill" id="settingsIcon"></i>
                    </button>
                </a>
                <a href="logout">
                    <button type="button" class="logoutButton">
                        <i class="bi bi-box-arrow-right" id="logoutIcon"></i>
                    </button>
                </a>
            </div>
        </div>
        <div class="center-column">
            <div class="content-box">
                <p th:if="${error}" th:text="${error}" class="error-message"></p>
                <p th:if="${ok}" th:text="${ok}" class="ok-message"></p>
                <!-- TODO: BIGGER FIELD -->
                <form method="post" action="/changeUsername">
                    <div>
                        Vaihda Käyttäjänimi
                    </div>
                    <div class="input-row">
                        <input name="newUsername" maxlength="64">
                        <!-- hack to disable submit when pressing Enter -->
                        <button type="submit" disabled style="display: none;" aria-hidden="true"></button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
                <!-- TODO: BIGGER FIELD -->
                <form method="post" action="/changeEmail">
                    <div>
                        Vaihda Sähköposti
                    </div>
                    <div class="input-row">
                        <input name="newEmail" maxlength="128">
                        <!-- hack to disable submit when pressing Enter -->
                        <button type="submit" disabled style="display: none;" aria-hidden="true"></button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
                <!-- TODO: BIGGER FIELD -->
                <form method="post" action="/changePassword">
                    <div>
                        Vaihda Salasana
                    </div>
                    <div class="input-row">
                        <input name="newPassword" maxlength="32">
                        <!-- hack to disable submit when pressing Enter -->
                        <button type="submit" disabled style="display: none;" aria-hidden="true"></button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
                <!-- TODO: BIGGER BUTTON -->
                <div class="content-heading">
                    <button type="button" onclick="darkMode()">Tumma tila</button>
                </div>
                <!-- TODO: MAKE A POPUP TO CONFIRM DELETION -->
                <!-- TODO: BIGGER BUTTON NADON THE BOTTOM -->
                <div>
                    <!-- Käytetään nyt JavaScriptiä kun ei HTMX <3 onnistunut järkevästi-->
                    <form method="post" action="/deleteUser"
                        onsubmit="return confirm('Haluatko varmasti poistaa tilisi?');">
                        <button type="submit">Poista tili</button>
                    </form>
                </div>
            </div>
        </div>
</body>
