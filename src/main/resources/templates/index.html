<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Home</title>
</head>

<body>
    <div class="top-bar">
        <h1>LOGO</h1>
    </div>

    <div class="columns">
        <div class="left-column">
            <div class="nav-icons-top">
                <a href="/frontpage">
                    <button type="button" class="homeButton">
                        <i class="bi bi-house-door-fill" id="homeIcon"></i>
                    </button>
                </a>
                <a href="profilepage">
                    <button type="button" class="profileButton">
                        <i class="bi bi-person-fill" id="profileIcon"></i>
                    </button>
                </a>
                <a>
                    <button type="button" class="newPostButton" onclick="toggleNewPost()">
                        <i class="bi bi-plus-circle" id="newPostIcon"></i>
                    </button>

                    <div class="popup" id="newPostPopup">
                        <form hx-post="/posts" hx-target=".center-column" hx-swap="afterbegin"
                            hx-on::after-request="if(event.detail.successful){ this.reset(); toggleNewPost(); }">

                            <!-- TODO: Vaihda name johonkin kuvaavampaan tassa ja css filussa -->
                            <textarea class="textarea-multiline" id="postTextarea" name="content" rows="4"
                                placeholder="Uusi julkaisu" maxlength="140" required></textarea>

                            <p>Max 140 merkkiä</p>

                            <div class="button-group">
                                <button type="button" onclick="toggleNewPost()">Peruuta</button>
                                <button type="submit">Julkaise</button>
                            </div>
                        </form>
                    </div>
                </a>
            </div>

            <div class="nav-icons-bottom">
                <a href="settingspage">
                    <button type="button" class="settingsButton">
                        <i class="bi bi-gear-fill" id="settingsIcon"></i>
                    </button>
                </a>
                <a href="logout">
                    <button type="button" class="logoutButton">
                        <i class="bi bi-box-arrow-right" id="logoutIcon"></i>
                    </button>
                </a>
            </div>
        </div>

        <!-- Thymeleaf stuff magic-->
        <div class="center-column">
            <div th:each="post : ${posts}" class="post-box">
                <strong th:text="${post.username}"></strong>
                <p th:text="${post.message}"></p>
                <i class="bi bi-hand-thumbs-up"></i>
            </div>
        </div>
</body>

</html>
