<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Home</title>
</head>

<body>
    <div class="top-bar">
        <h1>LOGO</h1>
    </div>

    <div class="columns">
        <div class="left-column">
            <div class="nav-icons-top">
                <a href="/">
                    <button type="button" class="homeButton">
                        <i class="bi bi-house-door-fill" id="homeIcon"></i>
                    </button>
                </a>
                <a href="profilepage">
                    <button type="button" class="profileButton">
                        <i class="bi bi-person-fill" id="profileIcon"></i>
                    </button>
                </a>
                <a>
                    <button type="button" class="newPostButton" onclick="toggleNewPost()">
                        <i class="bi bi-plus-circle" id="newPostIcon"></i>
                    </button>
                    
                    <div class="popup" id="newPostPopup">
                        <textarea class="textarea-multiline" id="postTextarea" rows="4" placeholder="Uusi julkaisu"></textarea>
                        <p>Max 140 merkkiä</p>

                        <div class="button-group">
                            <button onclick="toggleNewPost()">Peruuta</button>
                            <button onclick="submitPost()">Julkaise</button>
                        </div>
                    </div>
                </a>
            </div>

            <div class="nav-icons-bottom">
                <a href="settingspage.html">
                    <button type="button" class="settingsButton">
                        <i class="bi bi-gear-fill" id="settingsIcon"></i>
                    </button>
                </a>
                <a>
                    <button type="button" class="logoutButton">
                        <i class="bi bi-box-arrow-right" id="logoutIcon"></i>
                    </button>
                </a>
            </div>
        </div>
        
        <div class="center-column">
            <div class="post-box">
                <strong>Username</strong>
                <p>Post content</p>
            </div>
        </div>

        <!-- JULKAISUT DEMO
        <div class="center-column">
            <div class="text-input">
                <div class="demo-tekstilaatikko">
                    <textarea class="textarea-multiline" id="demo-multi-string" rows="3" placeholder="Text"
                        name="demo-multi-string" maxlength="140">
                    </textarea>
                </div>
            </div>
            <div class="feed">
                <div id="preview"></div>
            </div>
        </div>
    -->
        
        <script>
            function toggleNewPost() {
                const popup = document.getElementById('newPostPopup');
                popup.classList.toggle('open');
            }
            
            function submitPost() {
                const text = document.getElementById('postTextarea').value.trim();
                if (text === '') return;

                document.querySelector('.center-column').insertAdjacentHTML('afterbegin',
                '<div class="post-box"><strong>Username</strong><p>' + text + '</p></div>');

                document.getElementById('postTextarea').value = '';
                toggleNewPost();
            }
        </script>
    </body>

</html>
