<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="signup-page">
    <div class="top-bar">
        <h1><i class="bi bi-terminal" style="font-size: 2em;"></i></h1>
    </div>
    <div class="signup">
        <h1>SIGNUP</h1>
    </div>

    <div class="center-column">
        <!-- Error -->
        <p th:if="${error}" th:text="${error}" class="error-message"></p>
        <form method="post" action="/checkSignup">
            <input name="username" placeholder="Käyttäjänimi" maxlength="64" th:value="${prevUsername}">
            <input name="email" placeholder="Sähköposti" maxlength="128" th:value="${prevEmail}">
            <div style="display: flex; flex-direction: column;">
                <input name="password" type="password" placeholder="Salasana" maxlength="32">
                <label for="password" style="font-size: 7px;">Minimissään 8 merkkiä</label>
            </div>
            <button type="submit" class="submit">Rekisteröidy</button>
        </form>
    </div>
</body>

</html>
