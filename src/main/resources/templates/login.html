<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="login-page">
    <div class="top-bar">
        <h1><i class="bi bi-terminal" style="font-size: 2em;"></i></h1>
    </div>
    <div class="signup">
        <h1>SIGNUP</h1>
    </div>

    <div class="center-column">
        <p th:if="${error}" th:text="${error}" class="error-message"></p>
        <form method="post" action="/checkLogin">
            <input name="username" placeholder="Käyttäjänimi" maxlength="64" th:text="${prevUsername}">
            <input name="password" type="password" placeholder="Salasana" maxlength="32">
            <button type="submit" class="submit">Kirjaudu</button>
            <button type="button" onclick="window.location.href='signup'">Rekisteröidy</button>
        </form>
    </div>
</body>

</html>
